services:
  postgres-db:
    image: postgres:16-alpine
    container_name: baby_premium_pg
    environment:
      POSTGRES_DB: baby_premium_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata_premium:/var/lib/postgresql/data

volumes:
  pgdata_premium:
