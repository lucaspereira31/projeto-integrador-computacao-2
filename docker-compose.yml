services:
  postgres-db:
    image: postgres:16-alpine
    container_name: baby_premium_pg
    restart: unless-stopped

    environment:
      POSTGRES_DB: baby_premium_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123

    ports:
      - "5433:5432"

    volumes:
      - pgdata_premium:/var/lib/postgresql/data

volumes:
  pgdata_premium:
