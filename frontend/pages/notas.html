<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Premium - Diário & Anotações</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-top: 1.25rem;
    }
    .note-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .note-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
    }
    .tag-marco { background: rgba(99, 102, 241, 0.15); color: var(--primary); }
    .tag-humor { background: rgba(245, 158, 11, 0.15); color: #d97706; }
    .tag-saude { background: rgba(16, 185, 129, 0.15); color: #059669; }
    .tag-geral { background: rgba(148, 163, 184, 0.2); color: #475569; }
    
    .note-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .note-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }
    .note-body {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .note-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }
    .btn-delete-note {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
    }
    .btn-delete-note:hover {
      text-decoration: underline;
    }

    /* Modal de Nova Nota */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-control {
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    .btn-action-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-action-primary:hover { opacity: 0.9; }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.65rem 1rem;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR (Exibida no Computador) -->
    <aside class="sidebar">
      <div class="logo-container" style="margin-bottom: 2rem; display: flex; align-items: center; gap: 0.75rem;">
        <img src="../assets/images/logo.png" alt="Babá Premium Logo" style="max-width: 180px; height: auto; display: block;" onerror="this.style.display='none'">
        
      </div>
      <nav style="display: flex; flex-direction: column; gap: 1rem;">
        <a href="dashboard.html" style="color: var(--text-muted); text-decoration: none;">🏠 Dashboard</a>
        <a href="rotina.html" style="color: var(--text-muted); text-decoration: none;">📅 Rotina Diária</a>
        <a href="saude.html" style="color: var(--text-muted); text-decoration: none;">🩺 Saúde & Vacinas</a>
        <a href="estatisticas.html" style="color: var(--text-muted); text-decoration: none;">📊 Gráficos</a>
        <a href="notas.html" style="color: var(--primary); font-weight: bold; text-decoration: none;">📝 Diário</a>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      
      <!-- CABEÇALHO -->
      <section class="baby-card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2>Diário do Bebê</h2>
          <p style="color: var(--text-muted); font-size: 0.85rem;">Registre marcos de desenvolvimento, humor e notas livres</p>
        </div>
        <button class="btn-action-primary" onclick="abrirModalNota()">+ Nova Anotação</button>
      </section>

      <!-- LISTA DE ANOTAÇÕES -->
      <div class="notes-grid" id="container-notas">
        <!-- Renderizado dinamicamente via JavaScript -->
      </div>

    </main>

    <!-- BARRA INFERIOR MOBILE -->
    <nav class="bottom-nav">
      <a href="dashboard.html"><span>🏠</span>Início</a>
      <a href="rotina.html"><span>📅</span>Rotina</a>
      <a href="saude.html"><span>🩺</span>Saúde</a>
      <a href="estatisticas.html"><span>📊</span>Gráficos</a>
      <a href="notas.html" class="active"><span>📝</span>Diário</a>
    </nav>
  </div>

  <!-- MODAL DE NOVA NOTA -->
  <div class="modal-overlay" id="modal-nota">
    <div class="modal-card">
      <h3>Nova Anotação no Diário</h3>
      
      <form id="form-nota" onsubmit="salvarNovaNota(event)">
        <div class="form-group">
          <label>Categoria</label>
          <select id="nota-categoria" class="form-control">
            <option value="MARCO">⭐ Marco de Desenvolvimento</option>
            <option value="HUMOR">😊 Comportamento & Humor</option>
            <option value="SAUDE">🩺 Sintoma / Saúde</option>
            <option value="GERAL">📝 Observação Geral</option>
          </select>
        </div>

        <div class="form-group">
          <label>Título</label>
          <input type="text" id="nota-titulo" class="form-control" placeholder="Ex: Primeiro sorriso intencional" required>
        </div>

        <div class="form-group">
          <label>Descrição detalhada</label>
          <textarea id="nota-texto" class="form-control" rows="4" placeholder="Conte como foi o momento..." required></textarea>
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
          <button type="button" class="btn-cancel" style="flex: 1;" onclick="fecharModalNota()">Cancelar</button>
          <button type="submit" class="btn-action-primary" style="flex: 1;">Salvar Nota</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LÓGICA LOCAL DO DIÁRIO -->
  <script>
    const STORAGE_KEY = "baba_premium_notas";

    // Notas de demonstração iniciais caso o storage esteja vazio
    const notasIniciais = [
      {
        id: 1,
        titulo: "Segurou o chocalho sozinho",
        texto: "Hoje durante a brincadeira no tapete ele conseguiu firmar as duas mãozinhas no brinquedo e levou até a boca.",
        categoria: "MARCO",
        data: "Ontem, às 16:20"
      },
      {
        id: 2,
        titulo: "Reação leve pós-vacina",
        texto: "Ficou um pouco mais manhoso no final da tarde após as vacinas de 4 meses. Sem febre aferida.",
        categoria: "SAUDE",
        data: "22 de Outubro"
      },
      {
        id: 3,
        titulo: "Dormiu rápido com música clássica",
        texto: "Testamos colocar sons instrumentais suaves e o ritual de relaxamento antes da soneca durou menos de 10 minutos.",
        categoria: "HUMOR",
        data: "20 de Outubro"
      }
    ];

    function carregarNotas() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notasIniciais));
        return notasIniciais;
      }
      return JSON.parse(raw);
    }

    function renderizarNotas() {
      const container = document.getElementById("container-notas");
      const notas = carregarNotas();
      container.innerHTML = "";

      const classeTags = {
        MARCO: { classe: "tag-marco", rotulo: "⭐ Marco" },
        HUMOR: { classe: "tag-humor", rotulo: "😊 Humor" },
        SAUDE: { classe: "tag-saude", rotulo: "🩺 Saúde" },
        GERAL: { classe: "tag-geral", rotulo: "📝 Geral" }
      };

      notas.forEach(nota => {
        const tagInfo = classeTags[nota.categoria] || classeTags.GERAL;
        const card = document.createElement("div");
        card.className = "note-card";
        card.innerHTML = `
          <div>
            <div class="note-header">
              <span class="note-tag ${tagInfo.classe}">${tagInfo.rotulo}</span>
              <span class="note-date">${nota.data}</span>
            </div>
            <h4 class="note-title" style="margin-top: 0.6rem;">${nota.titulo}</h4>
            <p class="note-body">${nota.texto}</p>
          </div>
          <div class="note-footer">
            <button class="btn-delete-note" onclick="excluirNota(${nota.id})">Excluir</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function abrirModalNota() {
      document.getElementById("modal-nota").classList.add("open");
    }

    function fecharModalNota() {
      document.getElementById("modal-nota").classList.remove("open");
      document.getElementById("form-nota").reset();
    }

    function salvarNovaNota(e) {
      e.preventDefault();
      const titulo = document.getElementById("nota-titulo").value.trim();
      const texto = document.getElementById("nota-texto").value.trim();
      const categoria = document.getElementById("nota-categoria").value;

      const notas = carregarNotas();
      const nova = {
        id: Date.now(),
        titulo,
        texto,
        categoria,
        data: "Hoje, às " + new Date().toTimeString().slice(0, 5)
      };

      notas.unshift(nova);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notas));
      renderizarNotas();
      fecharModalNota();
    }

    function excluirNota(id) {
      let notas = carregarNotas();
      notas = notas.filter(n => n.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notas));
      renderizarNotas();
    }

    document.addEventListener("DOMContentLoaded", renderizarNotas);
  </script>
</body>
</html>
